<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="ONIONTRACE — passive OSINT for Tor onion services">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1318"/>
      <stop offset="1" stop-color="#111A21"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0A256" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E0A256" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1060" cy="160" r="190" fill="url(#glow)"/>

  <!-- concentric layers: an onion mark, drawn from scratch -->
  <g fill="none" stroke-linecap="round">
    <circle cx="1060" cy="160" r="118" stroke="#E0A256" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="1060" cy="160" r="96"  stroke="#E0A256" stroke-opacity="0.34" stroke-width="1.5"/>
    <circle cx="1060" cy="160" r="74"  stroke="#E0A256" stroke-opacity="0.50" stroke-width="2"/>
    <circle cx="1060" cy="160" r="52"  stroke="#4FB3A5" stroke-opacity="0.62" stroke-width="2"/>
    <circle cx="1060" cy="160" r="30"  stroke="#4FB3A5" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle cx="1060" cy="160" r="8"   fill="#E0A256" stroke="none"/>
    <path d="M1060 42 A118 118 0 0 1 1178 160" stroke="#E0A256" stroke-opacity="0.65" stroke-width="2"/>
    <path d="M942 160 A118 118 0 0 1 1060 278" stroke="#4FB3A5" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="1178" cy="160" r="3.5" fill="#E0A256"/>
    <circle cx="942"  cy="160" r="3.5" fill="#4FB3A5"/>
  </g>

  <!-- wordmark -->
  <text x="72" y="94" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" letter-spacing="6.5" fill="#E0A256">PASSIVE OSINT  ·  TOR ONION SERVICES</text>
  <text x="70" y="172" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="66" font-weight="700" letter-spacing="1.5" fill="#E8EDF3">ONIONTRACE</text>
  <text x="72" y="214" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="21" fill="#8B9AAB">Correlation with evidence, not assertions.</text>

  <line x1="72" y1="246" x2="592" y2="246" stroke="#2A3542" stroke-width="1"/>
  <text x="72" y="272" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace"
        font-size="13" fill="#5E6E7E">farm → gates → detect → correlate → attribute → graph</text>
</svg>
